<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <linearGradient id="boxTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="boxLeft2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="boxRight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="purpleRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#EA580C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgGrad2)"/>
  <circle cx="80" cy="70" r="50" fill="#FED7AA" opacity="0.5"/>
  <circle cx="330" cy="250" r="55" fill="#E9D5FF" opacity="0.5"/>
  <ellipse cx="200" cy="275" rx="110" ry="22" fill="#FDBA74" opacity="0.4"/>

  <g filter="url(#shadow2)">
    <polygon points="200,90 295,138 200,186 105,138" fill="url(#boxTop2)" stroke="#FDBA74" stroke-width="2"/>
    <polygon points="105,138 200,186 200,265 105,217" fill="url(#boxLeft2)" />
    <polygon points="295,138 200,186 200,265 295,217" fill="url(#boxRight2)" />
    
    <!-- Purple Strap -->
    <polygon points="188,96 212,84 212,180 188,192" fill="url(#purpleRibbon)"/>
    <polygon points="190,191 210,181 210,260 190,270" fill="url(#purpleRibbon)"/>
    <polygon points="105,172 200,220 200,232 105,184" fill="#6D28D9" opacity="0.9"/>
  </g>

  <!-- Glowing Game Controller Icon Badge -->
  <g transform="translate(190, 70)">
    <circle cx="10" cy="-10" r="28" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3" filter="url(#shadow2)"/>
    <text x="10" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#7C3AED" text-anchor="middle">🎮</text>
  </g>

  <g transform="translate(60, 110)">
    <circle cx="15" cy="15" r="18" fill="#EA580C"/>
    <text x="15" y="21" font-size="16" text-anchor="middle">⚡</text>
  </g>
  <g transform="translate(320, 110)">
    <circle cx="15" cy="15" r="18" fill="#7C3AED"/>
    <text x="15" y="21" font-size="16" text-anchor="middle">🕹️</text>
  </g>

  <text x="200" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#C2410C" text-anchor="middle" letter-spacing="1">GAMING MYSTERY BOX</text>
</svg>
