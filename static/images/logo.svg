<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EA580C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Mystery Box Icon -->
  <g transform="translate(10, 8)">
    <!-- Box Body -->
    <path d="M 22 2 L 42 12 L 22 22 L 2 12 Z" fill="url(#orangeGrad)" />
    <path d="M 2 12 L 22 22 L 22 44 L 2 34 Z" fill="#6D28D9" />
    <path d="M 42 12 L 22 22 L 22 44 L 42 34 Z" fill="#5B21B6" />
    <!-- Ribbon / Ribbon Bow -->
    <path d="M 12 7 L 32 17" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 32 7 L 12 17" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
    <!-- Mystery Sparkle -->
    <circle cx="22" cy="12" r="3.5" fill="#FFFFFF" filter="url(#glow)"/>
    <path d="M 22 5 L 22 19 M 15 12 L 29 12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Typography -->
  <text x="62" y="34" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="900" font-size="24" fill="#1E1B4B" letter-spacing="-0.5">Mystery<tspan fill="#EA580C">Mart</tspan></text>
  <text x="63" y="48" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#7C3AED" letter-spacing="1.2">UNBOX THE UNEXPECTED</text>
</svg>
